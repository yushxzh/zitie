name: 构建静态网站压缩包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 检查网站文件
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s vendor/hanzi-writer.min.js
          test -s vendor/pinyin-pro.js
          test -s data/永.json
          node --check app.js

      - name: 构建静态网站压缩包
        run: |
          zip -qr zitie-static.zip index.html styles.css app.js vendor data licenses
          unzip -t zitie-static.zip | tail -n 1
          sha256sum zitie-static.zip >> "$GITHUB_STEP_SUMMARY"

      - name: 上传压缩包
        uses: actions/upload-artifact@v7
        with:
          path: zitie-static.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" zitie-static.zip \
            --target "$GITHUB_SHA" \
            --title "小字帖构建 ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "由 GitHub Actions 构建，源码提交：${GITHUB_SHA}" \
            --latest
