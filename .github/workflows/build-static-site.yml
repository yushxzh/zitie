name: 构建静态网站压缩包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 检查网站文件
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s vendor/hanzi-writer.min.js
          test -s vendor/pinyin-pro.js
          test -s data/永.json
          node --check app.js

      - name: 构建静态网站压缩包
        run: |
          zip -qr zitie-static.zip index.html styles.css app.js vendor data licenses
          unzip -t zitie-static.zip | tail -n 1
          sha256sum zitie-static.zip >> "$GITHUB_STEP_SUMMARY"

      - name: 上传压缩包
        uses: actions/upload-artifact@v7
        with:
          path: zitie-static.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
