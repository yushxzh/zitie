<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ea">
  <meta name="description" content="小字帖是免费的汉字笔顺与田字格字帖生成器。输入 1～4 个汉字，查看拼音、逐笔笔顺和描红练习；支持手机使用和打印，适合儿童识字写字。">
  <title>汉字笔顺字帖生成器｜拼音、田字格描红与打印 - 小字帖</title>
  <link rel="canonical" href="https://zitie.ningboshuyu.com/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%232d655f'/%3E%3Cpath d='M12 32h40M32 12v40' stroke='%23a7d4c3' stroke-width='2' stroke-dasharray='4 3'/%3E%3Ctext x='32' y='47' text-anchor='middle' fill='white' font-family='serif' font-size='42'%3E字%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/hanzi-writer.min.js"></script>
  <script defer src="vendor/pinyin-pro.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">字</div>
      <div class="brand-copy"><strong>小字帖</strong><span>一笔一画，慢慢写好</span></div>
      <button id="print-button" class="print-button" type="button" aria-label="打印字帖">打印字帖</button>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div class="intro-copy">
        <span class="eyebrow">写字练习 · 一次最多四个字</span>
        <h1 id="page-title">汉字笔顺字帖</h1>
        <p>今天写什么字？输入 1 到 4 个汉字，查看拼音和逐笔笔顺，再跟着田字格练一练。</p>
      </div>
      <form id="character-form" class="search" autocomplete="off">
        <label for="character-input">输入汉字</label>
        <div class="search-row">
          <input id="character-input" name="character" value="永" inputmode="text" maxlength="8" aria-describedby="input-hint" required>
          <button type="submit">生成字帖</button>
        </div>
        <p id="input-hint" class="hint">一次输入 1～4 个汉字</p>
      </form>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="content" class="content"></div>

    <template id="character-template">
      <article class="character-sheet">
      <div class="sheet-title"><span class="sheet-number"></span><span class="sheet-title-character"></span><span class="sheet-title-pinyin"></span></div>
      <section class="lesson-card">
        <div class="section-head">
          <div><span class="section-index">01 / 认识这个字</span><h2>先看一看</h2></div>
          <span class="stroke-count"></span>
        </div>
        <div class="lesson-body">
          <div class="hero-character">
            <div class="character-stage grid" aria-label="汉字笔顺演示"></div>
            <button class="replay-button" type="button">▶ 再看一遍笔顺</button>
          </div>
          <div class="lesson-details">
            <span class="small-label">这个字读作</span>
            <div class="reading"><span class="display-character"></span><span class="display-pinyin"></span></div>
            <label class="pinyin-label">拼音可以修改 <span>多音字请按要学的读音填写</span></label>
            <input class="pinyin-input" type="text" maxlength="24" spellcheck="false" aria-label="修改拼音">
            <p class="detail-tip">观察每一笔的起点和方向，再动手练习。</p>
          </div>
        </div>
      </section>

      <section class="steps-section">
        <div class="section-head"><div><span class="section-index">02 / 按笔顺写</span><h2>一笔一笔，写成一个字</h2></div></div>
        <div class="stroke-steps"></div>
      </section>

      <section class="copybook-section">
        <div class="section-head"><div><span class="section-index">03 / 动手练习</span><h2>照着描，再自己写</h2></div></div>
        <div class="copybook-heading"><span class="sheet-character"></span><span class="sheet-pinyin"></span><span class="sheet-count"></span></div>
        <div class="practice-grid"></div>
        <p class="practice-note">前两格看字形，中间描红，最后自己写。打印后也能练习。</p>
      </section>
      </article>
    </template>
    <section class="seo-info" aria-labelledby="how-to-use-title">
      <h2 id="how-to-use-title">怎样用小字帖练习写字？</h2>
      <p>输入要学习的汉字，页面会生成每个字的拼音、笔顺动画和逐笔字形。先观察笔画顺序，再在田字格中描红、临写。</p>
      <p>一次可生成 1～4 个字，适合刚开始学习写字的孩子。字帖可在手机上查看，也可打印后练习；多音字的拼音可以手动修改。</p>
    </section>
    <footer>一字一练 · 从认真写好每一笔开始</footer>
  </main>
</body>
</html>
